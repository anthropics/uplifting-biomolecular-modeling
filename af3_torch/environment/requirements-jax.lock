# AF3-torch optimization kit — the tested stack of the featurisation/writer interpreter (AF3_TORCH_JAX_PY): `uv pip freeze` of /alphafold3_venv, a
# uv 0.9.24 virtual environment (prompt alphafold3-open) of the same CPython 3.12.1 (/usr/local/bin/python3.12). The kit runs this interpreter on CPU
# only (JAX_PLATFORMS=cpu): AlphaFold 3's featurisation before the model process and its output writers after it. alphafold3-open 3.1.4 is not on any
# index and has no installable line in this file (its entry below is a comment, kept so the list stays the whole freeze): it is the sokrypton/alphafold3
# fork at commit bc32b22f built for this interpreter (one compiled extension, alphafold3/cpp), the wheel alphafold3_open-3.1.4-cp312-cp312-linux_x86_64.whl
# that environment/Dockerfile (STOCK.md 'Stack' by hand) builds from that source, or takes from af3_torch/stock/wheels/ after the sha256 check against
# stock/PINS.json `reference.artefacts`, and installs --no-deps from the wheel file after this list -- never by name from an index.
# torch 2.5.1+cpu is PyTorch's CPU-only build, not a PyPI file: its line names the wheel on download.pytorch.org with the digest the index publishes;
# every other package comes from PyPI: `uv pip install --python /alphafold3_venv/bin/python --no-deps -r requirements-jax.lock` (pip works the same way)
# installs exactly the lines below and asks no index for the fork's package.
