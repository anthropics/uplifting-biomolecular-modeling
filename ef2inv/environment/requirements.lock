# ef2inv optimization kit — the tested stack: `uv pip freeze` of its interpreter, Python 3.12.14 (python-build-standalone 20260814 as uv 0.12.5
# installs it under /opt/uv-python) in the virtual environment /opt/ef2inv/.venv (no pip module; uv installs into it) on Ubuntu 22.04 with
# the CUDA 12.8.1 base and gcc 11.4. Nothing is left out: this kit (ef2inv/opt) and its shared core (common/opt_core) are not part of the stack — they
# install editable on top (README.md 'Setup'). Every plain `name==version` line is the PyPI file. torch 2.11.0+cu128 is the PyTorch cu128 build and
# triton 3.6.0 is the build PyTorch publishes beside it (not PyPI's file of the same version): both are pinned by direct URL on download.pytorch.org
# with the file's sha256. torch loads the CUDA 12.8 runtime, cuBLAS, cuDNN 9.19 and NCCL 2.28 from the nvidia-*-cu12 wheels below; triton and torch's
# inductor build kernels at first use with triton's own ptxas and the system C compiler. The GPU driver is the host's and must run CUDA 12.8 (570 or
# newer). Two more lines are not index pins: `transformers @ git+…@ef32577f` is the ESMFold2 fork pip installs from git at that commit; `dockq @ git+…`
# likewise. One distribution of the stack is NOT in this file because it is an editable git checkout, which a lock cannot carry: stock esm 3.4.0 =
# github.com/Biohub/esm at the commit stock/PINS.json `upstream.commit` names (d0207ea3; STOCK.md — the cookbook design script ships in the checkout, not in
# any wheel, and stock/check_pins.py requires the editable form); environment/Dockerfile clones it and installs it `-e` right after this
# file. flash-attn 2.8.3 and transformer-engine 2.15.0+42b8400 have no index build for this torch: environment/Dockerfile compiles them from their pinned
# sources, or installs the two published wheel files (sha256 in stock/PINS.json pinned_stack.image_recipe), after this file with those two lines
# filtered out by name. cuequivariance-ops-cu12 / -cu13 and cuequivariance-ops-torch-cu12 / -cu13 unpack into the same package directories; the cu12
# 0.10.0 pair owns them (installed last). environment/Dockerfile installs this file with --no-deps.
# Antibody numbering, for the cookbook's antibody-framework binders (`_is_antibody_sequence` / `_cdr_indices`: abnumber -> ANARCI -> hmmscan): abnumber
# 0.4.4 with the three distributions its metadata requires (anarcii 2.0.8, gemmi 0.7.5, sortedcontainers 2.4.0) and ANARCI 2026.2.13.2 (the PyPI distribution
# `anarci`, its HMMs included) are plain PyPI lines below; the HMMER 3.4 programs ANARCI calls are not a Python distribution and are pinned in
# environment/conda-hmmer.lock (environment/Dockerfile installs them under /opt/hmmer and links them into /usr/local/bin).
