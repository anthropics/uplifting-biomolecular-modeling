# ef2inv optimization kit — HMMER 3.4 (hmmer.org) for the pinned stack: the profile-HMM search programs ANARCI runs (`hmmscan`) when the
# cookbook numbers an antibody binder — `--binder-name <antibody>_framework_vhvl` or `--is-antibody 1` reach `_is_antibody_sequence` (l.524) and
# `_cdr_indices` (l.538), which call abnumber -> ANARCI -> hmmscan. HMMER is a set of C programs, not a Python distribution, so it is not a line
# of requirements.lock (abnumber 0.4.4 and ANARCI 2026.2.13.2 are): this file is the explicit conda package list — one package URL and its md5
# per line, nothing resolved at install time — of bioconda's hmmer 3.4 build and the conda-forge runtime libraries it links, the set the
# cookbook's own image line `hmmer=3.4` (channels conda-forge, bioconda) resolves, for linux-64. environment/Dockerfile installs it with
# micromamba into its own prefix /opt/hmmer, outside the Python environment, and links the HMMER programs into /usr/local/bin; any
# conda-compatible installer reproduces it: `micromamba create -p /opt/hmmer -f conda-hmmer.lock` or `conda create -p /opt/hmmer --file conda-hmmer.lock`.
# platform: linux-64
