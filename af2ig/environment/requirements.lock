# AF2 initial guess optimization kit — the tested stack: `python -m pip freeze --all` of its interpreter, Python 3.11.5 (/usr/local/bin/python,
# python-build-standalone 20230826) on Ubuntu 22.04 with the CUDA 12.4.1 runtime base, less the interpreter's bundled pip 23.2.1 and setuptools 68.1.2,
# this kit (af2ig/opt) and its shared core (common/opt_core) — those two install editable on top (README.md 'Setup').
# jax / jaxlib 0.5.3 with jax-cuda12-plugin / jax-cuda12-pjrt 0.5.3: the CUDA backend loads the CUDA 12.9 runtime, cuBLAS 12.9, cuDNN 9.23.2, cuFFT,
# cuSOLVER, cuSPARSE, NCCL 2.30.7 and nvJitLink from the nvidia-*-cu12 wheels below (found beside the plugin in site-packages, not from the system),
# and XLA compiles kernels with the ptxas of nvidia-cuda-nvcc-cu12 — no CUDA toolkit and no C compiler are used at run time. dm-haiku 0.0.16 is the
# model library, tensorflow-cpu 2.21.0 runs AlphaFold's feature pipeline on the CPU, numpy 1.26.4 / scipy 1.17.1 / biopython 1.85 as pinned in
# stock/PINS.json `pins`. The GPU driver is the host's and must run CUDA 12 (driver 525.60.13 or newer). Stock af2_initial_guess is not a
# Python distribution: it is the pinned dl_binder_design tree in af2ig/stock/, unpacked and patched by `run.sh install`.
# environment/Dockerfile installs this file with --no-deps.
