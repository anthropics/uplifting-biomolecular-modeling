# Evo 2 optimization kit — the tested stack `img_a100` (NVIDIA A100-SXM4-80GB; variant 7b in the modes configs/a100.env names for that card —
# fast and the 40b are refused by name there): requirements-img_full.lock WITHOUT Transformer Engine (the three
# transformer* distributions absent; stock/PINS.json stacks.img_a100), every other line identical. `python -m pip freeze --all` of its interpreter,
# Python 3.11.5 (/usr/local/bin/python, python-build-standalone 20230826) on Ubuntu 22.04 with the CUDA 12.8.1 devel base, less the interpreter's
# bundled pip 23.2.1 and this kit (evo2/opt, installed editable on top: README.md 'Setup'). torch 2.7.1 is the CUDA 12.8 build of
# download.pytorch.org (2.7.1+cu128; file and digest below), flash_attn 2.8.0.post2 upstream's published wheel for CUDA 12 / torch 2.7 / C++11 ABI /
# CPython 3.11 (file and digest below), evo2 0.6.0 and vtx 1.1.0 the wheels in evo2/stock/. Nothing in this file builds. The GPU driver is the
# host's and must run CUDA 12.8 (driver 570 or newer). environment/Dockerfile installs this file with --no-deps (`--build-arg STACK=img_a100`).
