# Evo 2 optimization kit — the tested stack `img_full` (NVIDIA H100 80GB / H200; both variants, every mode): `python -m pip freeze --all` of its
# interpreter, Python 3.11.5 (/usr/local/bin/python, python-build-standalone 20230826) on Ubuntu 22.04 with the CUDA 12.8.1 devel base (nvcc 12.8.93,
# gcc 11.4), less the interpreter's bundled pip 23.2.1 and this kit (evo2/opt, installed editable on top: README.md 'Setup'). torch 2.7.1 is the
# CUDA 12.8 build of download.pytorch.org (torch.__version__ 2.7.1+cu128, the line below names the file and its digest): it loads the CUDA 12.8
# runtime, cuBLAS, cuDNN 9.7.1 and NCCL 2.26.2 from the nvidia-* wheels below; triton 3.3.1 builds vortex's kernels at first use with its own ptxas
# and the system C compiler. flash_attn 2.8.0.post2 is upstream's published wheel for CUDA 12 / torch 2.7 / C++11 ABI / CPython 3.11 (the line
# names the file and its digest; sm_80 and sm_90 kernels inside). transformer_engine 2.3.0 and transformer_engine_cu12 2.3.0 are the PyPI wheels
# (the second carries libtransformer_engine.so); transformer-engine-torch 2.3.0 is PyPI's source archive, which environment/Dockerfile compiles
# against this torch with nvcc 12.8 for sm_90 after everything else is installed (--no-build-isolation) — the one line of this file that builds.
# evo2 0.6.0 and vtx 1.1.0 are the wheels in evo2/stock/ (the PyPI files, STOCK.md). The GPU driver is the host's and must run CUDA 12.8
# (driver 570 or newer). environment/Dockerfile installs this file with --no-deps; requirements-img_a100.lock is this stack without Transformer Engine.
