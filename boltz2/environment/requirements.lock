# Boltz-2 optimization kit — the tested stack: `python -m pip freeze --all` of its interpreter, Python 3.11.12 (/usr/local/bin/python of the
# official image python:3.11.12-slim-bookworm: Debian 12, gcc 12.2 from build-essential), less this kit (boltz2/opt) and its shared core
# (common/opt_core) — those two install editable on top (README.md 'Setup'). torch 2.12.0 is PyPI's CUDA 13.0 build (torch.__version__
# 2.12.0+cu130): it loads the CUDA 13.0 runtime, cuBLAS, cuDNN 9.20 and NCCL 2.29 from the nvidia-* wheels below (no CUDA toolkit on the system);
# triton 3.7.0 builds the kits' kernels at first use with its own ptxas and the system C compiler; cuequivariance 0.10.0 brings its CUDA 13 ops
# (cuequivariance-ops-cu13, the triangle kernels stock boltz calls). The GPU driver is the host's and must run CUDA 13.0 (driver 580 or newer).
# boltz 2.2.1 is the wheel in boltz2/stock/ (the PyPI file); environment/Dockerfile installs pip at this file's version first, then this file
# with --no-deps (the list is complete), the boltz line replaced by that wheel.
# nvidia-cublas-cu12 / nvidia-cuda-nvrtc-cu12: present in the tested interpreter, loaded by nothing in this stack — torch and cuequivariance use the CUDA-13 wheels.
