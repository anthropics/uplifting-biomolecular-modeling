# Genie 3 optimization kit — the pinned Python stack (`pip freeze --all` of the venv the kit was developed and tested in: STOCK.md Stack).
# Python 3.10.13 on Linux x86_64; every line is a PyPI distribution except the one VCS line, stock Genie 3 itself — upstream ships no wheel, so its
# pin is the source checkout at commit d77ae5ac installed editable (`pip install -e .`, upstream's README), which pip clones from that line
# (`--src DIR` chooses where; the image uses /opt, giving /opt/genie3). torch 2.7.1 is PyPI's cu126 build: its nvidia-*-cu12 lines are the
# CUDA 12.6 / cuDNN 9.5 / NCCL 2.26 runtime it loads, and it needs an NVIDIA driver that runs CUDA 12 applications (525.60 or newer; the stack was
# tested on 580.95.05, STOCK.md). pip, setuptools and wheel are the venv's own tools at the versions the editable install of the checkout was built
# with (environment/Dockerfile installs the checkout with --no-build-isolation, as upstream's scripts/setup/setup.sh does).
# environment/Dockerfile installs this file in two passes: every `name==version` line with --no-deps, then the VCS line with --no-deps
# --no-build-isolation --src /opt. In your own Python 3.10 venv: `pip install -r requirements.lock --src <dir for the genie3 checkout>`.
