# Protenix v1 optimization kit — the tested stack: `python -m pip freeze --all` of its interpreter, Python 3.11.5 (/usr/local/bin/python,
# python-build-standalone 20230826) on Ubuntu 22.04 with the CUDA 12.9.1 development base (nvcc 12.9, gcc 11.4), less the interpreter's bundled
# pip 23.2.1, this kit (protenix_v1/opt) and its shared core (common/opt_core) — those two install editable on top (README.md 'Setup').
# torch 2.13.0 is PyPI's CUDA 13.0 build (torch.__version__ 2.13.0+cu130): it loads the CUDA 13.0 runtime, cuBLAS, cuDNN 9.20 and NCCL 2.29 from
# the unsuffixed nvidia-* and nvidia-*-cu13 wheels below; the nvidia-*-cu12 wheels and torchaudio 2.8.0+cu129 / torchvision 0.23.0+cu129 are the
# CUDA 12.9 line this stack was upgraded from and stay installed beside it — those two are PyTorch-index builds, pinned here by their file URL
# and sha256 (every other line is the PyPI file; no package index but PyPI is consulted); cuequivariance 0.11.1 (cuequivariance-ops-torch-cu12)
# serves stock's triangle kernels, triton 3.7.1 builds the kit's kernels at first use with its own ptxas and the system C compiler, and stock's
# fast LayerNorm extension (LAYERNORM_TYPE=fast_layernorm) is compiled with the base's nvcc. The GPU driver is the host's and must run CUDA 13.0
# (driver 580 or newer). protenix 1.1.0 is the wheel in protenix_v1/stock/ (the PyPI file; its declared torch==2.7.1 / triton==3.3.1 /
# cuequivariance 0.8.0 pins do not hold on this stack, STOCK.md); environment/Dockerfile installs this file with --no-deps in two passes read
# from it by name: everything but the CUDA 13 line, then that line (torch, triton, nvidia-*-cu13 — nvidia-cudnn/nccl/cusparselt cu12 and cu13
# share their directories: the CUDA 13 copies are the ones torch 2.13.0 loads, so they are laid down last).
