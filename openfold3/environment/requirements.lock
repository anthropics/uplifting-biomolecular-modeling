# OpenFold3 optimization kit — the tested stack: `python -m pip freeze --all` of its interpreter, Python 3.11.5 (/usr/local/bin/python,
# python-build-standalone 20230826) on Ubuntu 22.04 with the CUDA 12.8.1 devel base (nvcc 12.8, gcc 11.4), less the interpreter's bundled pip 23.2.1, this
# kit (openfold3/opt) and its shared core (common/opt_core) — those two install editable on top (README.md 'Setup'). torch 2.10.0 is PyPI's CUDA 12.8
# build (torch.__version__ 2.10.0+cu128): it loads the CUDA 12.8 runtime, cuBLAS, cuDNN 9.10.2 and NCCL 2.27.5 from the nvidia-*-cu12 wheels below; triton
# 3.6.0 builds the kit's kernels at first use with its own ptxas and the system C compiler; deepspeed 0.19.2 is installed from its source distribution with
# the DS4Sci evoformer_attn op compiled by nvcc against nvidia-cutlass 3.8.0.0's headers (environment/Dockerfile: the stock configuration's attention
# kernel; sm_90 by default); the FlashPairformer extension of `fast` is compiled by nvcc at first use (CUDA_HOME=/usr/local/cuda). The GPU driver is the
# host's and must run CUDA 12.8 (driver 570 or newer). openfold3 0.4.1 is the wheel in openfold3/stock/ (the PyPI file); environment/Dockerfile installs
# this file with --no-deps.
