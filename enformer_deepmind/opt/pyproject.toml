# enformer_deepmind_opt — the exact kit for the official Enformer TF-Hub SavedModel, as a package. Install editable from this directory
# (`pip install -e enformer_deepmind/opt`, or `bash run.sh install`): the op library (enformer_deepmind_opt/ops/) and the pins
# (../stock/PINS.json) are resolved from the package's own location, so the install must stay editable. No install-time dependency on the
# stack (tensorflow, tensorflow-hub, numpy: stock/PINS.json); the stack is checked at activation. The build backend is setuptools plus one
# step that ships enformer_deepmind_opt_autoload.pth at the wheel root, which is what makes `ENFORMER_DEEPMIND_OPT=exact` engage the kit
# without code changes (enformer_deepmind_opt/_autoload.py).
[build-system]
requires = ["setuptools>=64"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "enformer_deepmind_opt"
dynamic = ["version"]
description = "Official Enformer (TensorFlow / Sonnet) inference optimizations: one exact mode, engaged by ENFORMER_DEEPMIND_OPT=exact or enformer_deepmind_opt.enable()"
requires-python = ">=3.10"
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
enformer-deepmind-opt = "enformer_deepmind_opt.__main__:main"

[tool.setuptools]
packages = ["enformer_deepmind_opt", "enformer_deepmind_opt.ops", "enformer_deepmind_opt.tests"]
include-package-data = true

[tool.setuptools.package-data]
"enformer_deepmind_opt.ops" = ["*.so", "*.json", "*.cc", "*.cu", "*.sh", "*.md", "SHA256SUMS"]

[tool.setuptools.dynamic]
version = {attr = "enformer_deepmind_opt.__version__"}
