# BoltzGen optimization kit — the tested stack: `python -m pip freeze --all` of its interpreter, Python 3.11.5 (/usr/local/bin/python,
# python-build-standalone 20230826) on Ubuntu 22.04 with the CUDA 13.0.1 base image and gcc 11.4, less this kit (boltzgen/opt) and its shared core
# (common/opt_core) — those two install editable on top (README.md 'Setup', STOCK.md 'Stack'). One list, installed with `pip install --no-deps -r`: every line is the
# package index's file except torch (its CUDA 13.0 build, 2.13.0+cu130) and triton 3.7.1, which are the PyTorch index's wheels, named below by URL and
# sha256 (the PyTorch index's triton 3.7.1 is its own build of that version, not the package index's file); torch loads the CUDA 13.0 runtime,
# cuBLAS 13.1, cuDNN 9.20 and NCCL 2.29 from the nvidia-* wheels of this list and nothing from the system; triton builds the launchers of the
# cuEquivariance kernels at first use with its own ptxas and the system C compiler. cuequivariance 0.11.1 stands on NVIDIA's CUDA-13
# kernel pair (cuequivariance-ops-cu13, cuequivariance-ops-torch-cu13 0.11.1); boltzgen 0.3.2's wheel metadata names the CUDA-12 pair instead, so
# `pip check` reports those two names and nothing else (stock/PINS.json stack_of_record freeze_deviation). pip 26.2.1, setuptools 84.0.0 and wheel
# 0.48.0 replace the interpreter's bundled ones: those three lines install first, by the bundled pip (environment/Dockerfile reads them from this
# file), then the rest by pip 26.2.1.
# boltzgen 0.3.2 is the wheel in boltzgen/stock/ (the package index file), installed from there after this list. The GPU driver is the host's and
# must run CUDA 13.0 (driver 580 or newer).
