# Protenix v2 optimization kit — the tested stack: `python -m pip freeze --all` of its interpreter, Python 3.11.5 (/usr/local/bin/python,
# python-build-standalone 20230826) on Ubuntu 24.04 with the CUDA 13.0.1 development base (nvcc, cuDNN 9.13 headers) and gcc 13.3. This kit
# (protenix_v2/opt) and its shared core (common/opt_core) are not in it — they install editable on top (README.md 'Setup'). pip 26.2.1 is the
# stack's pip, newer than the interpreter's bundled one: environment/Dockerfile installs this file's pip line first, then the whole file with --no-deps
# (minus the stock line). Three lines are files of the PyTorch index, pinned by URL and sha256 — torch 2.13.0+cu130 and torchvision 0.28.0+cu130 (its CUDA
# 13.0 builds) and triton 3.7.1 (the PyTorch index's build of that release, not PyPI's: other bytes); every other line is PyPI's file at that version.
# torch loads the CUDA 13.0 runtime, cuBLAS, cuDNN 9.20.0 and NCCL 2.29.7 from the nvidia-* wheels below; triton and the cuEquivariance 0.11.1 cu13
# ops build their kernels at first use. deepspeed 0.17.5, ihm 2.11 and modelcif 1.4 ship as source on PyPI and are built at install (ihm compiles one C
# extension with the system gcc). protenix 2.0.0 is the wheel in protenix_v2/stock/ (its declared torch 2.7.1 / triton 3.3.1 / cuequivariance 0.8.0 cu12
# pins do not hold on this stack, STOCK.md). The GPU driver is the host's and must run CUDA 13.0 (driver 580 or newer).
