# PXDesign optimization kit — the tested stack: `python -m pip freeze --all` of its interpreter, Python 3.11.5 (/usr/local/bin/python,
# python-build-standalone 20230826) on Ubuntu 22.04 with the CUDA 12.1.1 development base (nvcc 12.1, gcc 11.4), less the interpreter's bundled
# pip 23.2.1 (its bundled setuptools is listed by version), this kit (pxdesign/opt) and its shared core (common/opt_core) — those two install
# editable on top (README.md 'Setup'). torch 2.3.1+cu121 is the PyTorch-index CUDA 12.1 build, pinned below by its URL and sha256 (every other line is PyPI's): it loads the
# CUDA 12.1 runtime, cuBLAS, cuDNN 8.9.2 and NCCL 2.20.5 from the nvidia-*-cu12 wheels below through its own RPATH; the base's nvcc and gcc build
# stock's LayerNorm CUDA extension (LAYERNORM_TYPE=fast_layernorm, stock's default and every mode's) into the protenix package directory —
# in environment/Dockerfile at build time, otherwise when protenix first imports it — with the ninja of this list. The GPU driver is the host's and must run CUDA 12.1 (driver 525.60 or newer). Stock is the three upstream lines in
# their own form: protenix from its repository at the pinned commit (a regular install, which also provides the top-level `configs` and `runner`
# packages protenix imports), pxdesign and pxdbench as editable checkouts of their pinned commits (pip clones them under --src; PXDesign's own
# install is `pip install -e .`) — STOCK.md; environment/Dockerfile installs this file with --no-deps.
