# OpenDDE optimization kit — the tested stack: `python -m pip freeze --all` of its interpreter, Python 3.11.5 (/usr/local/bin/python,
# python-build-standalone 20230826) on Ubuntu 24.04 with the CUDA 12.6.3 development base (nvcc 12.6 and the CUDA headers stay in the image: stock's
# fused LayerNorm, LAYERNORM_TYPE=fast_layernorm, builds its extension with ninja + nvcc at first use), gcc 13.2, hmmer (Ubuntu 24.04's package) and
# kalign 3.3.5 from apt, less the interpreter's bundled pip 23.2.1, this kit (opendde/opt) and its shared core (common/opt_core) — those two install
# editable on top (README.md 'Setup'); setuptools 68.1.2 is the interpreter's bundled copy, pinned here for other interpreters. torch 2.7.1+cu126 is the
# CUDA 12.6 build, pinned by the URL of its file on download.pytorch.org with that file's sha256 (every other pin is PyPI's file; no index option is
# needed): it loads the CUDA 12.6 runtime, cuBLAS, cuDNN 9.5.1 and NCCL 2.26 from the nvidia-*-cu12 wheels below; triton 3.3.1 and cuequivariance 0.10.0
# (cu12) build / carry the GPU kernels. The GPU driver is the host's and must run CUDA 12.6 (driver 560 or newer). opendde 1.1.1 is the wheel in
# opendde/stock/ (the PyPI file); environment/Dockerfile installs this file with --no-deps and that wheel after it. cuda-bindings 12.8.0 (the CUDA
# driver API bindings, `cuda.bindings`; no dependencies of its own) is the one addition to the interpreter's freeze: the shared core's native
# triangle-multiplication loader uses it when present and falls back to ctypes over libcuda.so.1 without it; the tested tree has the wheel.
