# ProGen2 optimization kit — the tested stack: `python -m pip freeze --all` of its interpreter, the virtual environment /opt/venv on python-build-standalone
# CPython 3.9.23 (release 20250818, the build uv 0.8.13 installs for cpython-3.9.23-linux-x86_64-gnu) on Ubuntu 22.04 with the CUDA 12.8.1 runtime base and gcc 11.4;
# pip 26.0.1 and setuptools 82.0.1 are the environment's own (newer than the interpreter's bundled pip 23.0.1 / setuptools 58.1.0: environment/Dockerfile
# installs this file's pip line first, then the whole file in one `pip install --no-deps -r` pass). This kit (progen2/opt, package progen2_opt) installs
# editable on top (README.md 'Setup'). torch 2.8.0+cu128 is pinned by its wheel's URL on the PyTorch cu128 index and its sha256 (PyPI carries no +cu128
# build): it loads the CUDA 12.8 runtime, cuBLAS 12.8.4, cuDNN 9.10.2 and NCCL 2.27.3 from the nvidia-*-cu12 wheels below through its own RPATH; triton 3.4.0 is
# torch's dependency, importable and unused on the kit's routes, pinned the same way to the PyTorch index's own build of it (its two native libraries differ
# from PyPI's file of the same version); every other line is PyPI's; transformers 4.16.2 / tokenizers 0.10.3 are the stock's own
# pins (stock/PINS.json). Nothing here compiles for a GPU: the kit's one native library ships prebuilt (opt/forward/engines/progen2/kits/v0_ew/libew_progen2.so,
# CUDA 12.8, sm_80 / sm_90 / sm_100). The GPU driver is the host's and must run CUDA 12.8 (570 or newer).
