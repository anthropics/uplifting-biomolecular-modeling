# ColabFold optimization kit — the tested stack: `python -m pip freeze --all` of its interpreter, Python 3.11.5 (/usr/local/bin/python,
# python-build-standalone 20230826) on Ubuntu 22.04 with the CUDA 12.4.1 runtime base (no C compiler), less the interpreter's bundled pip 23.2.1 and
# setuptools 68.1.2 (they come with the interpreter), this kit (colabfold/opt) and its shared core (common/opt_core) — those two install editable
# on top (README.md 'Setup'). jax / jaxlib 0.5.3 with jax-cuda12-plugin / jax-cuda12-pjrt 0.5.3 load the CUDA 12.9 runtime, cuBLAS 12.9,
# cuDNN 9.23, NCCL 2.30 and ptxas (nvidia-cuda-nvcc-cu12) from the nvidia-*-cu12 wheels below — nothing of the base image's CUDA libraries is
# used by the model and nothing is compiled at install or run time. The GPU driver is the host's and must run CUDA 12 (driver 550 or newer:
# `nvidia-smi` reports CUDA Version 12.4 or later). colabfold 1.6.1 and alphafold-colabfold 2.3.13 are the wheels in colabfold/stock/ (the
# PyPI files; `pip check` is clean on this stack); environment/Dockerfile installs this file with --no-deps.
