# ESM-IF1 optimization kit — the tested stack: `python -m pip freeze --all` of its interpreter, Python 3.11.5 (/usr/local/bin/python,
# python-build-standalone 20230826) on Ubuntu 22.04 with the CUDA 12.1.1 runtime base, less the interpreter's bundled pip 23.2.1, this kit
# (esm_if1/opt) and its shared core (common/opt_core) — those two install editable on top (README.md 'Setup'). Every line is the PyPI release
# except the five named by URL and digest: torch 2.4.0+cu121, the CUDA 12.1 build from the PyTorch wheel index (PyPI's `torch==2.4.0` carries no
# local tag) — it loads the CUDA 12.1 runtime, cuBLAS, cuDNN 9.1 and NCCL 2.20 from the nvidia-*-cu12 wheels below through its own library path,
# nothing from the system; torch_scatter / torch_sparse / torch_cluster (+pt24cu121), the prebuilt PyG extension wheels for this torch from the PyG
# wheel page (PyPI does not carry these builds; torch-geometric 2.6.1 is a required import of upstream's esm.inverse_folding); setuptools 68.1.2,
# the PyPI wheel the interpreter's build installed from a local copy. fair-esm 2.0.1 is upstream at commit 2b369911 — the archive in
# esm_if1/stock/ (the same bytes as the git line below; PyPI's fair-esm 2.0.0 is NOT this pin). environment/Dockerfile installs this file with
# `pip install --no-deps -r` (the fair-esm line filtered out by name) and then fair-esm from the archive. The GPU driver is the host's and must
# run CUDA 12.1 (driver 530 or newer).
