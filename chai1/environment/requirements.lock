# Chai-1 optimization kit — the tested stack: `python -m pip freeze --all` of its interpreter, Python 3.11.5 (/usr/local/bin/python,
# python-build-standalone 20230826) on Ubuntu 22.04 with the CUDA 13.0.1 runtime base and gcc 11.4, less the interpreter's bundled pip 23.2.1, this
# kit (chai1/opt) and its shared core (common/opt_core) — those two install editable on top (README.md 'Setup'). torch 2.13.0 is PyPI's CUDA 13.0
