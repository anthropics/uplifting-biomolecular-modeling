# RoseTTAFold3 optimization kit — the tested stack: `python -m pip freeze --all` of its interpreter, Python 3.12.1 (/usr/local/bin/python,
# python-build-standalone 20240107) on Ubuntu 22.04 with the CUDA 12.6.3 base and gcc 11.4, less the interpreter's pip 23.3.2, this kit
# (rosettafold3/opt) and its shared core (common/opt_core) — those two install editable on top, into the patched interpreter opt/venv (README.md
# 'Install'). Stock is rc-foundry 0.2.1.dev13, installed from RosettaCommons/foundry at commit 4010e3e2e (the `rc-foundry @ git+…` line: pip clones it
# and builds the wheel with hatchling; stock/foundry-4010e3e2e.tar.gz is the same source, STOCK.md). torch 2.13.0 is PyPI's CUDA 13.0 build
# (torch.__version__ 2.13.0+cu130): it loads the CUDA 13.0 runtime, cuBLAS, cuDNN 9.20 and NCCL 2.29 from the nvidia-* wheels below (the CUDA 12
# nvidia-*-cu12 wheels are part of the tested tree and stay: torch's loader maps them too); triton 3.7.1 builds the kit's kernels at first use with
# its own ptxas and the system C compiler; cuequivariance 0.11.1 runs on its cu13 ops pair (cuequivariance-ops-cu13 / -torch-cu13; the cu12 pair
# rc-foundry's `rf3` extra names is absent, stock/PINS.json "pinned_stack"). The GPU driver is the host's and must run CUDA 13.0 (driver 580 or
# newer). environment/Dockerfile installs this file with --no-deps, in two passes: nvidia-cudnn-cu12/-cu13 and nvidia-nccl-cu12/-cu13 unpack into
# the same nvidia/cudnn and nvidia/nccl directories, and the tested tree holds the cu13 files there, so the cu13 pair is laid down last.
