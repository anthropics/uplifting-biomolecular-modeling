# Enformer optimization kit — the tested stack: `python -m pip freeze --all` of its interpreter, Python 3.11.12 (/usr/local/bin/python, the
# CPython of the official python:3.11.12-slim-bookworm container image: Debian 12, glibc 2.36) with gcc 12.2 (build-essential) beside it, less this
# kit (enformer/opt), which installs editable on top (README.md 'Setup'). torch 2.13.0 is PyPI's CUDA 13.0 build (torch.__version__
# 2.13.0+cu130): it loads the CUDA 13.0 runtime, cuBLAS 13.1, cuDNN 9.20 and NCCL 2.29 from the nvidia-* wheels below (no CUDA toolkit is installed
# anywhere; the GPU driver is the host's and must run CUDA 13.0 — driver 580 or newer). enformer-pytorch 0.8.12 (stock) is the wheel in enformer/stock/
# (the PyPI file); nvidia-cudnn-frontend 1.27.0 — the one distribution the kit adds over the stock stack (STOCK.md) — is named by its PyPI file and
# sha256 so pip checks the bytes. environment/Dockerfile first brings pip, wheel and uv to the versions below with the base image's own pip, then
# installs every other line from the index (setuptools included), then the two named wheels, all with --no-deps.
