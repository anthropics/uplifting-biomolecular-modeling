# RFdiffusion3 optimization kit — the tested stack: `python -m pip freeze --all` of either of its two identical Python 3.12.1 environments
# (/opt/stock and /opt/kit, `python -m venv` off python-build-standalone 20240107 at /usr/local) on Ubuntu 22.04 with the CUDA 12.8.1 runtime base
# and gcc 11.4. Two lines are not index packages and come from rfdiffusion3/stock/, installed with --no-deps by environment/Dockerfile after the
# rest of this file: rc-foundry 0.2.1.dev13+g4010e3e2e = stock RFdiffusion3 (RosettaCommons foundry at commit 4010e3e2) built from
# stock/foundry-4010e3e.tar.gz, and apex 0.1 = NVIDIA apex at commit a1d527a8 with its C++/CUDA extensions, a wheel built once from that commit
# into stock/wheels/ (STOCK.md §Stack; no public wheel exists for this torch and none is shipped; upstream binds its FusedRMSNorm whenever apex imports,
# STOCK.md). torch 2.13.0 is PyPI's CUDA 13.0 build (torch.__version__ 2.13.0+cu130): it loads the CUDA 13.0 runtime, cuBLAS, cuDNN 9.20 and
# NCCL 2.29 from the nvidia-* wheels below, not from the base image; triton 3.7.1 builds kernels at first use with its own ptxas and the system
# C compiler. The GPU driver is the host's and must run CUDA 13.0 (driver 580 or newer). This kit (rfdiffusion3/opt) and its shared core
# (common/opt_core) are not in this list: they install editable on top, into both environments (README.md 'Setup'). pip and setuptools here are the
# environments' own, newer than the interpreter's bundled ones: environment/Dockerfile installs this file's pip line first, then the rest with it.
