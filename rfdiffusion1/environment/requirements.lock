# RFdiffusion-1 optimization kit — the pinned Python stack (the versions this release was tested with), `pip freeze` form.
# Interpreter: CPython 3.11.5 (python-build-standalone 20230826, x86_64-unknown-linux-gnu) with its bundled pip 23.2.1 and setuptools 68.1.2,
# which are therefore not lines of this file. Platform: Linux x86_64, glibc 2.35 (Ubuntu 22.04).
# torch 2.4.0 is PyPI's CUDA 12.1 build (torch.__version__ reads 2.4.0+cu121): its CUDA 12.1 / cuDNN 9.1 / NCCL 2.20 runtime libraries are the
# nvidia-*-cu12 wheels below, loaded from site-packages — no CUDA toolkit is needed on the machine, only an NVIDIA driver that runs CUDA 12.
# dgl 2.4.0+cu124 is not on PyPI: its line names the wheel itself on DGL's own wheel list for torch 2.4 / CUDA 12.4 (data.dgl.ai), with the
# file's sha256, so pip fetches exactly that build; every other line resolves on PyPI.
# Stock RFdiffusion 1.1.0 (RosettaCommons/RFdiffusion @ 86507b65) and its vendored SE3Transformer are not lines of this file: they install from
# the source archive in rfdiffusion1/stock/ (environment/Dockerfile, README.md 'Setup'); this kit and its shared core install last (`run.sh install`).
# Install exactly these builds, without letting pip re-resolve dependencies:
#   python -m pip install --no-deps -r requirements.lock
