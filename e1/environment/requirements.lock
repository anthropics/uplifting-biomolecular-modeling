# E1 optimization kit — the tested stack: `python -m pip freeze --all` of its interpreter, Python 3.12.10 (/usr/local/bin/python, the CPython of
# the official `python:3.12.10-slim-bookworm` image: Debian 12, gcc 12.2), less this kit (e1/opt) and the shared core (common/opt_core) — those two
# install editable on top (README.md 'Setup'). pip 25.1.1 replaces the interpreter's bundled pip. torch 2.8.0 is PyPI's CUDA 12.8 build
# (torch.__version__ 2.8.0+cu128): it loads the CUDA 12.8 runtime, cuBLAS, cuDNN 9.10 and NCCL 2.27 from the nvidia-*-cu12 wheels below (no CUDA
# toolkit is installed beside them); flash_attn 2.8.3.post1 is the prebuilt wheel of the Dao-AILab v2.8.3.post1 release for this torch (stock/PINS.json
# flash_attn_wheel); triton 3.4.0 builds the hub RMSNorm kernel, the kit's kernels and the compiled flex-attention at first use with the system C
# compiler. Stock E1 1.0.0 is the git install of Profluent-AI/E1 at commit bfd2620a (stock/PINS.json upstream; its dependency list brings ipykernel
# and the Jupyter client packages; debugpy is named by the address of its platform-independent wheel, the build this stack holds — by version alone pip
# would take the cp312 manylinux build). The GPU driver is the host's and must run CUDA 12.8 (driver 570 or newer). environment/Dockerfile installs
# this file with --no-deps.
