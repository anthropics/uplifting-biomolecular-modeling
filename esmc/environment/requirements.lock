# ESM C optimization kit — the tested stack: `python -m pip freeze --all` of its interpreter, Python 3.12.1 (/usr/local/bin/python,
# python-build-standalone 20240107, the x86_64_v3 build) on Ubuntu 24.04 with the CUDA 13.0.1 runtime base, gcc 13.3 and clang 18, less the
# interpreter's bundled pip 23.3.2 and less this kit (esmc/opt), which installs editable on top (README.md 'Setup'); plus the two tools the
# kit's CUDA-extension build needs in this interpreter and a `python -m venv` environment lacks: setuptools (84.0.0, the release the
# Dockerfile's source builds use; torch's extension builder imports it) and ninja. torch 2.11.0 is PyPI's CUDA 13.0 build (torch.__version__ 2.11.0+cu130): it loads the CUDA 13.0 runtime, cuBLAS 13.6
# (nvidia-cublas 13.6.1.10, above torch's own pin: Transformer Engine's), cuDNN 9.19 and NCCL 2.28 from the nvidia-* wheels below; triton 3.6.0
# and the system C compiler build kernels at first use. esm 3.4.0 and the Biohub transformers fork 4.57.6 install from their pinned git commits
# (STOCK.md; the ESM C modules of that esm source are unpacked under esmc/stock/src/ for reading), dockq from the commit esm's dependency list
# names; flash_attn 2.7.4.post1 and transformer_engine_torch 2.15.0 are upstream's prebuilt wheels for this Python / torch / CUDA (its wheel
# release py312-pt211-cu13-sm80-90), fetched by URL and checked by digest. xformers is absent on purpose (STOCK.md): `pip check` reports esm's
# declared xformers and transformer-engine-cu13's importlib-metadata as not installed — expected. The GPU driver is the host's and must run
# CUDA 13.0 (driver 580 or newer). environment/Dockerfile installs this file with --no-deps.
