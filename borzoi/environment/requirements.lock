# Borzoi optimization kit — the tested stack, pinned: `pip freeze --all` of the environment this kit is tested in (Python 3.10.17,
# stock/PINS.json `python` / `pins`): tensorflow 2.15.1 with the CUDA 12.2 / cuDNN 8.9 runtime as nvidia-*-cu12 wheels (the only CUDA
# user-space the stack loads: TensorFlow resolves them beside itself in site-packages), keras 2.15.0, numpy 1.24.4, h5py 3.10.0, pandas 1.5.3,
# pysam 0.22.1, scipy 1.9.3 and the rest of upstream's dependency set, plus the interpreter's tooling at the versions the stack carries
# (pip 25.1.1 — installed first: it replaces the base image's bundled pip and runs every later install —, setuptools 65.5.1, wheel 0.45.1,
# uv 0.7.19). The two `-e git+https://…` lines are the pinned upstream itself — calico/baskerville @ 544073b and calico/borzoi @ 5c93582,
# editable: environment/Dockerfile installs them from the archives in stock/ at /opt/baskerville and /opt/borzoi (README.md 'Setup' route C
# shows the same commands) and filters these two lines out of the `pip install -r` pass; given to pip as they stand they clone the same
# commits from GitHub instead. Install with --no-deps (the set is complete and consistent: `pip check` passes); Linux x86_64, CPython 3.10.
