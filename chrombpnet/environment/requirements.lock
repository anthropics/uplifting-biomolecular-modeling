# ChromBPNet optimization kit — the tested stack: `python -m pip freeze --all` of its interpreter, Ubuntu 20.04's Python 3.8.10 (/usr/bin/python3.8,
# `python` on PATH) inside the tensorflow/tensorflow:2.8.2-gpu image (CUDA 11.2.2 / cuDNN 8.1.0.77 system libraries from NVIDIA's apt packages, gcc 9.4),
# i.e. every distribution under /usr/local/lib/python3.8/dist-packages, less two things that are not lock lines: stock chrombpnet 1.0.1, which installs
# from the source archive in chrombpnet/stock/ (kundajelab/chrombpnet @ eaa0fe58, --no-deps), and this kit (chrombpnet/opt), which installs editable on
# top (`run.sh install`, README.md 'Setup'). Eleven modules the interpreter also sees come from Ubuntu packages of the base image, not pip, and are
# therefore absent here: requests 2.22.0, urllib3 1.25.8, idna 2.8, chardet 3.0.4, certifi 2019.11.28, six 1.14.0, wheel 0.34.2, dbus-python, PyGObject,
# python-apt, requests-unixsocket (/usr/lib/python3/dist-packages) — an environment built outside the image installs the first seven from PyPI at those
# versions (STOCK.md 'Stack' gives the line; tensorflow imports six). tensorflow 2.8.0 loads CUDA 11.2, cuBLAS 11.4, cuFFT, cuRAND, cuSOLVER, cuSPARSE and
# cuDNN 8.1 from the system libraries the base image installs (stock/check_pins.py fingerprints libcudart, libcublas and libcudnn); it carries SASS up to
# sm_80 and PTX for compute_80, so on H100/H200 the driver compiles its kernels at first use (the config's driver-cache tarball, README.md 'Setup',
# spares that). One lock per install root: this file is the interpreter's own environment (/usr/local); torch 2.4.1 / triton 3.0.0 for the kit's
# H100/H200 forward live under the second root /opt/torch, off the default sys.path, which one freeze of this interpreter cannot express —
# chrombpnet/environment/requirements-opt-torch.lock is that root's lock. The base interpreter's own pip (20.2.4) and setuptools (62.3.2) are
# not this stack's: environment/Dockerfile installs this file's pip== and setuptools== lines first, then the whole file with --no-deps (setuptools 75.3.2
# builds the five source-only distributions — deeplift, matplotlib-venn, modisco, pyfaidx, termcolor — and the kit's editable install).
