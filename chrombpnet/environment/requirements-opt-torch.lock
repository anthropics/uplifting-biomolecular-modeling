# ChromBPNet optimization kit — the side root /opt/torch of the tested stack: `python -m pip freeze --all --path /opt/torch`, the torch stack the kit's
# H100/H200 forward (the K1 Triton route, opt/kit/torch/chrombpnet_k1) imports. One lock per install root: requirements.lock is the interpreter's own
# environment (/usr/local), this file is the second root, installed with `pip install --no-deps --target /opt/torch` and NOT on the interpreter's
# default sys.path: the TensorFlow environment of requirements.lock never sees it (its typing_extensions 4.13.2 would break
# tensorflow 2.8.0's pin), and the kit inserts /opt/torch at the K1 route's import (stock/PINS.json pins_s1_only: root /opt/torch, torch 2.4.1,
# triton 3.0.0 — stock/check_pins.py checks both there). torch 2.4.1+cu124 is the PyTorch CUDA 12.4 build, pinned below by its file on
# download.pytorch.org (PyPI carries no +cu124 build; every other line is the PyPI file); it loads the CUDA 12.4 runtime, cuBLAS, cuDNN 9.1 and
# NCCL 2.20 from the nvidia-*-cu12 wheels here, independent of the base image's CUDA 11.2.
# triton 3.0.0 compiles the K1 kernels' launchers at first use with the system gcc when the kit's shipped kernel cache (opt/kit/torch/triton_cache_sm90)
# does not already hold them. The GPU driver must run CUDA 12.4 (550 or newer) for this route.
