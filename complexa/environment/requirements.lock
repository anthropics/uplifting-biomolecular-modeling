# Proteina-Complexa optimization kit — the tested stack, pinned: `pip freeze --all` of the tested environment (Debian 12, CPython 3.12.10,
# linux x86_64), verbatim. 172 index distributions (torch 2.7.0 = PyPI's CUDA 12.6 build with its nvidia-*-cu12 runtime wheels — CUDA 12.6, cuDNN 9.5.1,
# NCCL 2.26.2; lightning 2.5.6, hydra-core 1.3.1, numpy 2.5.1, jax 0.4.29; pip / setuptools / wheel / uv as installed there — the pip line is newer than
# the interpreter's bundled pip, so environment/Dockerfile installs that one line first, read from this file, then the rest) plus the two `-e git+…`
# lines, which are upstream itself: proteinfoundation 1.1.0 and its community_models/colabdesign (colabdesign 1.1.1.1), both editable from ONE checkout
# of NVIDIA-Digital-Bio/proteina-complexa at commit 916eaaed (stock/PINS.json upstream; the URL below is that checkout's origin, the same repository under its
# other organisation name). environment/Dockerfile installs everything except those two lines with `pip install --no-deps -r` (it filters them out by
# their `-e ` prefix) and the checkout from the archive in complexa/stock/, never from the network; README.md 'Setup' route C does the same by hand.
# Four distributions are not PyPI's files and are pinned by direct URL with their sha256: the torch_cluster / torch_scatter / torch_sparse `+pt27cu126`
# wheels from data.pyg.org and the jaxlib `+cuda12.cudnn91` wheel from the jax-releases bucket (the pages upstream's env/build_uv_env.sh installs from);
# everything else resolves on PyPI. The `==` lines are also the constraint under which pip builds this file's source distributions (environment/Dockerfile
# PIP_CONSTRAINT): their build tools resolve to the versions listed here.
