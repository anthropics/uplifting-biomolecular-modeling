# Flashzoi optimization kit — the tested stack: `python -m pip freeze --all` of its interpreter, Python 3.11.12 (/usr/local/bin/python, the
# CPython build of the official python:3.11.12-slim-bookworm image) on Debian 12 with gcc 12.2 — every line as printed, nothing left out; this kit
# (flashzoi/opt) is not part of it: it installs editable on top (README.md 'Setup'). torch 2.5.1 is
# PyPI's CUDA 12.4 build (torch.__version__ 2.5.1+cu124): it loads the CUDA 12.4 runtime, cuBLAS, cuDNN 9.1 and NCCL 2.21 from the nvidia-*-cu12
# wheels below and the stack has no other CUDA libraries; triton 3.1.0 builds the kit's kernels at first use with its own ptxas and the system C
# compiler; flash-attn 2.7.0.post2 is upstream's prebuilt wheel for this torch (the release file named on its line, checked by sha256), so nothing
# is compiled at install. The GPU driver is the host's and must run CUDA 12.4 (driver 550 or newer). borzoi-pytorch 0.5.1 is the wheel in
# flashzoi/stock/ (the PyPI file); environment/Dockerfile installs pip, wheel and uv from this file first, then the rest with --no-deps.
