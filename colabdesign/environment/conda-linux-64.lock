# ColabDesign optimization kit — the tested stack's conda environment as an explicit package list: every package of the environment at /opt/conda,
# each as its conda-forge URL and md5 (336 packages, linux-64 + noarch; nothing is solved at install). CPython 3.10.18 (/opt/conda/bin/python),
# jax 0.6.0 with jaxlib 0.6.0 in conda-forge's CUDA 12 build (cuda126py310hec873cc_200: it carries the jax-cuda12-plugin / jax-cuda12-pjrt 0.6.0 entries and
# the xla_cuda12 plugin), dm-haiku 0.0.17, numpy 1.26.4, scipy 1.15.2, and the CUDA 12.9 libraries the plugin loads from /opt/conda/lib (LD_LIBRARY_PATH;
# cudart 12.9.79, cuBLAS 12.9.2.10, cuDNN 9.10.2.21, NCCL 2.30.7.1) with cuda-nvcc 12.9.86 for ptxas, plus the rest of BindCraft's package list
# (biopython, pandas, matplotlib, seaborn, openmm 8.6.0, pdbfixer 1.12, ffmpeg, py3dmol …) and the environment's own pip 25.1.1 / setuptools 80.9.0.
# micromamba, mamba and conda install this file as it stands, at any prefix:
#   micromamba create -y -n colabdesign-kit -f colabdesign/environment/conda-linux-64.lock     (README.md 'Setup' route C; environment/Dockerfile installs it at /opt/conda)
# pip then adds stock ColabDesign from colabdesign/stock/ and the entries of requirements.lock, and `run.sh install` adds the kit (README.md 'Setup').
# The GPU driver is the host's and must load these CUDA 12.9 libraries (tested with driver 575; CUDA 12 minor-version compatibility from R525 on, untested here).
