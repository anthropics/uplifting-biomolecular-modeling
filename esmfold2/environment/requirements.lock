# ESMFold2 optimization kit — the tested stack (torch 2.13.0+cu130 · triton 3.7.1 · CUDA 13.0 / cuDNN 9.20 / NCCL 2.29 runtime wheels · numpy 2.3.5 ·
# stock esm 3.3.0 and the transformers 4.57.6 fork at their pinned commits · flash-attn 2.8.3.post1 · transformer_engine 2.15.0 · xformers 0.0.35),
# read back with `pip freeze --all` from the image the kit is tested on: every distribution of that environment, CPython 3.12.10, less nothing.
# Three lines name wheels that exist on no index — flash_attn, transformer_engine, xformers: CUDA extensions built from their public sources for
# sm_90 against this torch (stock/PINS.json "image" has each wheel's file name, sha256 and build) — the Dockerfile filters those three lines out of
# the `pip install -r` pass and installs the wheel files from esmfold2/stock/wheels/ (built there by its WHEELS_FROM=build route, or placed). esm,
# transformers and dockq install from git at the commits written here (git on PATH). pip 25.1.1 is this stack's pip, newer than the
# interpreter's bundled one: the Dockerfile installs that line first (read from this file) and it installs every other line. torch==2.13.0 on
# PyPI's default index is the CUDA 13.0 build (+cu130).
# Install exactly as esmfold2/environment/Dockerfile does: `pip install --no-deps -r` this file minus those three lines, then the three wheels --no-deps.
