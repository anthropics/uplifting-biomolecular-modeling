# Caliby optimization kit — the tested stack: `python -m pip freeze --all` of its interpreter, Python 3.12.10 (/usr/local/bin/python, the
# interpreter of the public python:3.12.10-slim-bookworm image: Debian 12, CPython built --enable-optimizations --with-lto --enable-shared)
# with gcc 12.2 (build-essential), less this kit (caliby/opt) and its shared core (common/opt_core) — those two install editable on top
# (README.md 'Setup'). pip 25.1.1, setuptools 84.0.0 and wheel 0.45.1 are part of the stack (pip replaces the interpreter's bundled one;
# the source distributions below — ihm, antlr4-python3-runtime, p_tqdm and the three upstream packages — build with them at install).
# torch 2.6.0 is PyPI's CUDA 12.4 build (torch.__version__ 2.6.0+cu124): it loads the CUDA 12.4 runtime, cuBLAS, cuDNN 9.1 and NCCL 2.21
# from the nvidia-*-cu12 wheels below — no CUDA toolkit is installed in the system; triton 3.2.0 compiles the kit's fused LCP kernel at
# first use with its own ptxas and the system C compiler. The GPU driver is the host's and must run CUDA 12.4 (driver 550 or newer).
# caliby 0.1, atomworks-caliby 1.0.0 and protpardelle 1.3.2 are upstream at the pinned commits (stock/PINS.json): the three `@ git+https`
# lines are that pin; environment/Dockerfile installs the same trees from the archives in caliby/stock/ in their place, and every other
# line of this file, with --no-deps.
