# AlphaFold 3 (JAX) optimization kit — the tested stack, and the one list of it in this tree: `uv pip freeze` of the stock interpreter
# /alphafold3_venv/bin/python (a uv 0.9.24 virtual environment of Python 3.12.1, python-build-standalone 20240107 x86_64_v3, unpacked in /usr/local) on
# Ubuntu 24.04 with the CUDA 12.6.3 base image and gcc 13.3, less stock itself — the fork at the STOCK.md pin (alphafold3-open 3.1.4, the one stock patch
# applied), which environment/Dockerfile installs from the prebuilt wheel af3_jax/stock/wheels/ (stock/PINS.json upstream.wheel) after this list.
# stock/check_pins.py compares that interpreter with these lines before every route. jax 0.10.2 loads the CUDA 12.9 runtime, cuDNN 9.17 and NCCL 2.29
# from the nvidia-*-cu12 wheels below and ptxas from nvidia-cuda-nvcc-cu12; the GPU driver is the host's and must run CUDA 12 (driver 550 or newer; 580
# tested). torch 2.7.1+cpu, PyTorch's CPU build (the weights converter's only extra), is not a PyPI file: its line names PyTorch's own wheel by URL and
# sha256, so no package index but PyPI is consulted. Install with `--no-deps` (the list is complete): `pip install --no-deps -r requirements.lock`
# (uv: `uv pip install --no-deps -r requirements.lock`). This kit (af3_jax/opt) and its shared core (common/opt_core) are not in it: they install
# editable into an environment of their own (README.md Setup).
