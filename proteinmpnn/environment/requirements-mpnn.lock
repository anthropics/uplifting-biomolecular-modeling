# ProteinMPNN optimization kit — stack `mpnn` (variants soluble | vanilla): the exact package set the kit's modes are tested on, for
# Python 3.11.5 on Linux x86_64. environment/Dockerfile installs it; to reproduce the stack in your own Python 3.11
# environment: pip install --no-deps -r requirements-mpnn.lock, then `bash run.sh install` (README.md 'Setup', route C).
# --no-deps: the list is complete (every distribution of the stack, dependencies included) and is installed as a set, not re-resolved.
# torch 2.5.1+cu124 is PyTorch's own CUDA 12.4 wheel, named by its URL and sha256 (PyPI carries no +cu124 build); every other line is the PyPI
# file of that name and version. torch loads its CUDA 12.4 / cuDNN 9.1 / NCCL 2.21 user-space libraries from the nvidia-*-cu12 wheels below (RPATH
# into site-packages/nvidia), not from a system CUDA toolkit. pip 23.2.1 and setuptools 68.1.2 are the interpreter distribution's own
# (python-build-standalone 20230826, cpython 3.11.5) and so are not lines of this file. Host requirement: an NVIDIA driver that runs CUDA 12.4
# (550 or newer).
