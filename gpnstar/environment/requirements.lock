# GPN-Star optimization kit — the tested stack: `python -m pip freeze --all` of its interpreter, Python 3.13.15 (/usr/local/bin/python, the CPython of
# the official `python:3.13.15-slim-bookworm` image: Debian 12), less this kit (gpnstar/opt) and the shared core (common/opt_core) — those two
# install editable on top (README.md 'Setup'). pip 26.2.1 replaces the interpreter's bundled pip. torch 2.13.0 is PyPI's CUDA 13.0 build
# (torch.__version__ 2.13.0+cu130): it loads the CUDA 13.0 runtime, cuBLAS 13.1, cuDNN 9.20 and NCCL 2.29 from the nvidia-* and cuda-toolkit wheels
# below (no CUDA toolkit is installed beside them); triton 3.7.1 is torch's own dependency: idle on the kit's path — the model runs eager PyTorch in
# fp32 with the attention math backend, nothing is compiled — and used by torch.compile's inductor backend only under upstream's `--torch-compile`
# flag. transformers is held at 5.15.0, the release stock gpn itself pins; huggingface_hub 1.31.0,
# safetensors 0.8.0, accelerate 1.15.0, numpy 2.5.3 and zarr 3.3.0 are the releases the kit was measured with; every other line is pip's resolution
# of `torch==2.13.0 transformers==5.15.0 accelerate==1.15.0 huggingface_hub==1.31.0 numpy==2.5.3 safetensors==0.8.0 zarr==3.3.0
# "gpn[inference] @ git+https://github.com/songlab-cal/gpn@6f28c81bcbfe7d65cb6d8ece9ce88f87ca583791"` on that interpreter. Stock gpn 0.9.0 is
# songlab-cal/gpn at commit 6f28c81b (stock/PINS.json upstream), installed from the byte-frozen archive of that commit the bundle carries,
# gpnstar/stock/gpn-6f28c81b.tar.gz: its line below is that archive's path relative to the bundle's top directory (the one holding gpnstar/ and
# common/), and pip builds it with hatchling; its inference extra brings datasets, pandas, pyarrow, biopython and zarr. The GPU driver is the
# host's and must run CUDA 13.0 (driver 580 or newer). environment/Dockerfile installs this file with --no-deps, the archive line filtered out
# (the Dockerfile installs its own copy of the same archive); on its own the file is one-pass installable from the bundle's top directory:
# `python -m pip install --no-deps -r gpnstar/environment/requirements.lock` (README.md 'Setup').
